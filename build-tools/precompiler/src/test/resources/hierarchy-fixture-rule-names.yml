# Matching rules named as upstream accepts any name: the names need escaping where the build records them.
hierarchy:
  GENERAL:
    K8S_SERVICE: "fqdn:k8s"
    MYSQL: "short name"
auto-matching-rules:
  "fqdn:k8s": "{ (u, l) -> u.name == l.name }"
  "short name": "{ (u, l) -> u.shortName == l.shortName }"
  "a=b#c": "{ (u, l) -> u.name == l.shortName }"
  "#first": "{ (u, l) -> u.shortName == l.name }"
  "zählung": "{ (u, l) -> u.name != l.name }"
layer-levels:
  GENERAL: 2
  K8S_SERVICE: 0
  MYSQL: 1
