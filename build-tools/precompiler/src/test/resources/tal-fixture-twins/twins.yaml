# Two rules on one line agreeing on name, DSL text, input and prefix (in two layers): they run the same class, as
# upstream runs its two alike classes.
layerDefinitions:
  - name: FIXTURE_TAL_TWIN
    ordinal: 5104
rules: [{name: twin, layer: OTLP_GENERAL, dsl: "filter { persist {} }"}, {name: twin, layer: FIXTURE_TAL_TWIN, dsl: "filter { persist {} }"}]
