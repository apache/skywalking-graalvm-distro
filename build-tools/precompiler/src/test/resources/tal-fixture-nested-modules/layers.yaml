# requiredModules holding a list: upstream's loader binds the module name core from it, so the file is read and its
# layer registers, while requiredModulesOf's own read of the key gives [core].
requiredModules: [[core]]
layerDefinitions:
  - name: FIXTURE_NESTED_MODULES_LAYER
    ordinal: 5106
