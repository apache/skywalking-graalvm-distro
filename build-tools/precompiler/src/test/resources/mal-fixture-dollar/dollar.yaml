# A rule named with a $: upstream generates the top-level meter class review_cost$bytes, which the registry
# references as the top-level class it is.
expSuffix: service(['service'], Layer.GENERAL)
metricPrefix: review
metricsRules:
  - name: cost$bytes
    exp: cost_bytes.sum(['service'])
