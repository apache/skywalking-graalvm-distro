# Operator-written TAL rules, not the shipped ones: every metric shape, an FQCN input and output type, and a layer
# another file declares.
metricPrefix: fleet
rules:
  - name: fleet-calls
    layer: FIXTURE_FLEET
    inputType: otlp
    dsl: |
      filter {
        extractor {
          def svc = service(meta.service, meta.layer)
          metrics { name "calls"; scope svc; function cpm; value 1 }
          metrics { name "latency"; scope svc; function avg; value meta.latency }
          metrics { name "sla"; scope svc; function percent; match meta.statusCode != "ERROR" }
          metrics { name "apdex"; scope svc; function apdex; value meta.latency; status meta.statusCode != "ERROR" }
          metrics { name "latency_percentile"; scope svc; function percentile; value meta.latency; buckets [10, 25, 50]; ranks [50, 99] }
          metrics { name "calls_by_status"; scope svc; function sumLabeled; value 1; labels status: attr("http.response.status_code"); labelLimit 7 }
        }
      }
  - name: fleet-slow
    layer: FIXTURE_FLEET
    inputType: io.opentelemetry.proto.trace.v1.Span
    outputType: org.apache.skywalking.oap.server.analyzer.provider.trace.parser.listener.DatabaseSlowStatementBuilder
    dsl: |
      filter {
        if (meta.kind != "CLIENT") {
          abort {}
        }
        extractor {
          service meta.service
          id meta.traceId + "-" + meta.spanId
          statement span.name
          latency meta.latency
        }
        sink {}
      }
