# Metric rules a merge key brings in: upstream's loader binds them, its line index finds no line for them, and
# MetricConvert records the rule's line as unresolved (-1); the build compiles them at that coordinate.
expSuffix: service(['service'], Layer.GENERAL)
metricPrefix: meter_fixture_merged
<<: {metricsRules: [{name: calls, exp: "calls.sum(['service'])"}]}
