# Module provider inventory — immigration scope detector
# Tracks all upstream ModuleProvider implementations and their acceptance status.
# When a new provider appears upstream (e.g. after skywalking/ submodule update),
# ImmigrationScopeTest fails, forcing explicit categorization.
#
# Format: provider.FQCN = ACCEPTED | NOT_ACCEPTED
# ACCEPTED: wired in GraalVMOAPServerStartUp, config covered
# NOT_ACCEPTED: explicitly excluded from this distro

# --- Core ---
provider.org.apache.skywalking.oap.server.core.CoreModuleProvider = ACCEPTED

# --- Cluster ---
provider.org.apache.skywalking.oap.server.cluster.plugin.standalone.ClusterModuleStandaloneProvider = ACCEPTED
provider.org.apache.skywalking.oap.server.cluster.plugin.kubernetes.ClusterModuleKubernetesProvider = ACCEPTED
provider.org.apache.skywalking.oap.server.cluster.plugin.consul.ClusterModuleConsulProvider = NOT_ACCEPTED
provider.org.apache.skywalking.oap.server.cluster.plugin.etcd.ClusterModuleEtcdProvider = NOT_ACCEPTED
provider.org.apache.skywalking.oap.server.cluster.plugin.nacos.ClusterModuleNacosProvider = NOT_ACCEPTED
provider.org.apache.skywalking.oap.server.cluster.plugin.zookeeper.ClusterModuleZookeeperProvider = NOT_ACCEPTED

