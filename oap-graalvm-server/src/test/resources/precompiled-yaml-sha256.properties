# Pre-compiled YAML file SHA-256 hashes — staleness detector
# Tracks all YAML rule files that feed into the precompiler (MAL, LAL, TAL,
# envoy, telegraf, zabbix). When a file's content changes, its SHA-256
# will mismatch, causing PrecompiledYamlStalenessTest to fail and flag
# which test files need regeneration.
#
# Format: yamlPath=sha256
# To update after regenerating a test: recompute SHA and replace the line.

