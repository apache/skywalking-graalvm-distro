name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to build (leave empty for latest on current branch)'
        required: false
        default: ''
      version:
        description: 'Version label for release artifacts (e.g. 1.0.0-rc1). Leave empty for CI-only build.'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GHCR_IMAGE: ghcr.io/apache/skywalking-graalvm-distro
  DOCKERHUB_IMAGE: apache/skywalking-graalvm-distro

jobs:
  license-header:
    name: License Header Check
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.version == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check license headers
        uses: apache/skywalking-eyes/header@main

  # ── Shared: init skywalking submodule and cache .m2/repository ──
  init-skywalking:
    name: Init SkyWalking Submodule
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
      commit-sha: ${{ steps.meta.outputs.commit-sha }}
      version: ${{ steps.meta.outputs.version }}
      is-release: ${{ steps.meta.outputs.is-release }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit || github.ref }}
          submodules: recursive

      - name: Resolve build metadata
        id: meta
        run: |
          # Use full commit SHA for Docker tags (not --short)
          echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Determine if this is a release build
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Compute cache key
        id: cache-key
        run: echo "key=m2-skywalking-$(git -C skywalking rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Maven cache
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ steps.cache-key.outputs.key }}

      - name: Install SkyWalking submodule to Maven cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: make init-skywalking

  # ── CI: compile, javadoc, test, distro ──
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: init-skywalking
    if: needs.init-skywalking.outputs.is-release == 'false'
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Restore Maven cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: ${{ needs.init-skywalking.outputs.cache-key }}

      - name: Compile & Install
        run: make compile

      - name: Javadoc
        run: make javadoc

      - name: Test
        run: make test

      - name: Build distribution
        run: make build-distro

  # ── Native image build for Linux (per architecture) ──
  build-native-linux:
    name: Native Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: init-skywalking
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit || github.ref }}
          submodules: recursive

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Restore Maven cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: ${{ needs.init-skywalking.outputs.cache-key }}

      - name: Build native image
        run: make native-image

      - name: Locate distro tarball
        id: dist
        run: echo "path=$(ls oap-graalvm-native/target/oap-graalvm-native-*-native-dist.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (release only)
        if: github.event_name != 'pull_request' && needs.init-skywalking.outputs.is-release == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest (GHCR)
        if: github.event_name != 'pull_request'
        id: build-ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.native
          platforms: ${{ matrix.platform }}
          build-args: |
            DIST=${{ steps.dist.outputs.path }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push by digest (Docker Hub, release only)
        if: github.event_name != 'pull_request' && needs.init-skywalking.outputs.is-release == 'true'
        id: build-dockerhub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.native
          platforms: ${{ matrix.platform }}
          build-args: |
            DIST=${{ steps.dist.outputs.path }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digests
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests/ghcr /tmp/digests/dockerhub
          digest="${{ steps.build-ghcr.outputs.digest }}"
          touch "/tmp/digests/ghcr/${digest#sha256:}"
          if [[ -n "${{ steps.build-dockerhub.outputs.digest }}" ]]; then
            digest="${{ steps.build-dockerhub.outputs.digest }}"
            touch "/tmp/digests/dockerhub/${digest#sha256:}"
          fi

      - name: Rename tarball with arch and version
        if: github.event_name != 'pull_request'
        id: rename
        run: |
          VERSION="${{ needs.init-skywalking.outputs.version }}"
          SRC=$(ls oap-graalvm-native/target/oap-graalvm-native-*-native-dist.tar.gz)
          DEST="oap-graalvm-native/target/apache-skywalking-graalvm-distro-${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          cp "${SRC}" "${DEST}"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Upload digests
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/
          if-no-files-found: error
          retention-days: 1

      - name: Upload native tarball
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: native-tarball-linux-${{ matrix.arch }}
          path: ${{ steps.rename.outputs.path }}
          if-no-files-found: error
          retention-days: 1

      - name: Save Docker image for e2e (amd64 only)
        if: matrix.arch == 'amd64'
        run: |
          docker build -f docker/Dockerfile.native \
            --build-arg DIST=${{ steps.dist.outputs.path }} \
            -t skywalking-oap-native:latest .
          docker save skywalking-oap-native:latest -o /tmp/skywalking-oap-native.tar

      - name: Upload Docker image artifact (amd64 only)
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v5
        with:
          name: skywalking-oap-native-image
          path: /tmp/skywalking-oap-native.tar
          retention-days: 1

  # ── E2E tests using pre-built native image ──
  e2e:
    name: E2E ${{ matrix.test.name }}
    runs-on: ubuntu-latest
    needs: [init-skywalking, build-native-linux]
    if: needs.init-skywalking.outputs.is-release == 'false'
    timeout-minutes: 30
    env:
      SW_AGENT_JDK_VERSION: 17
      ISTIO_VERSION: 1.28.0
    strategy:
      fail-fast: false
      matrix:
        test:
          - name: Simple Java Agent
            case: simple-java-agent
          - name: Istio ALS
            case: istio-als
          - name: Event
            case: event
          - name: Menu
            case: menu
          - name: Alarm
            case: alarm
          - name: Log
            case: log
          - name: Meter
            case: meter
          - name: Trace Profiling
            case: trace-profiling
          - name: VM Telegraf
            case: vm-telegraf
          - name: VM Zabbix
            case: vm-zabbix
          - name: Zipkin
            case: zipkin
          - name: PromQL
            case: promql
          - name: LogQL
            case: logql
          - name: TraceQL
            case: traceql
          - name: Baseline
            case: baseline
          - name: Auth
            case: auth
          - name: OTLP Traces
            case: otlp-traces
          - name: Virtual MQ
            case: virtual-mq
          - name: Kafka Exporter
            case: exporter
          - name: Self Observability
            case: so11y
          - name: MQE
            case: mqe
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v5
        with:
          name: skywalking-oap-native-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/skywalking-oap-native.tar

      - name: Set up JDK 17 (test service build)
        if: matrix.test.case == 'baseline' || matrix.test.case == 'mqe'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore Maven cache (test service build)
        if: matrix.test.case == 'baseline' || matrix.test.case == 'mqe'
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: ${{ needs.init-skywalking.outputs.cache-key }}
          restore-keys: m2-skywalking-

      - name: Build mock sender jar (baseline only)
        if: matrix.test.case == 'baseline'
        run: |
          cd skywalking && ./mvnw -B -q \
            -f test/e2e-v2/java-test-service/pom.xml \
            -pl e2e-mock-sender -am \
            package -DskipTests -Dmaven.javadoc.skip

      - name: Build mock baseline server jar (mqe only)
        if: matrix.test.case == 'mqe'
        run: |
          cd skywalking && ./mvnw -B -q \
            -f test/e2e-v2/java-test-service/pom.xml \
            -pl e2e-mock-baseline-server -am \
            package -DskipTests -Dmaven.javadoc.skip

      - name: Run E2E test
        uses: apache/skywalking-infra-e2e@8c21e43e241a32a54bdf8eeceb9099eb27e5e9b4
        with:
          e2e-file: $GITHUB_WORKSPACE/test/e2e/cases/${{ matrix.test.case }}/e2e.yaml

      - name: Upload E2E logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: e2e-logs-${{ matrix.test.case }}
          path: "${{ env.SW_INFRA_E2E_LOG_DIR }}"

  # ── Merge per-arch images into multi-arch manifest ──
  docker-manifest:
    name: Docker Manifest
    runs-on: ubuntu-latest
    needs: [init-skywalking, build-native-linux]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (release only)
        if: needs.init-skywalking.outputs.is-release == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push GHCR manifest
        working-directory: /tmp/digests/ghcr
        run: |
          VERSION="${{ needs.init-skywalking.outputs.version }}"
          COMMIT_SHA="${{ needs.init-skywalking.outputs.commit-sha }}"
          IS_RELEASE="${{ needs.init-skywalking.outputs.is-release }}"
          TAGS="-t ${{ env.GHCR_IMAGE }}:${COMMIT_SHA}"
          if [[ "${IS_RELEASE}" == "true" ]]; then
            TAGS="${TAGS} -t ${{ env.GHCR_IMAGE }}:${VERSION} -t ${{ env.GHCR_IMAGE }}:latest"
          fi
          docker buildx imagetools create \
            ${TAGS} \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)

      - name: Create and push Docker Hub manifest (release only)
        if: needs.init-skywalking.outputs.is-release == 'true'
        working-directory: /tmp/digests/dockerhub
        run: |
          VERSION="${{ needs.init-skywalking.outputs.version }}"
          docker buildx imagetools create \
            -t ${{ env.DOCKERHUB_IMAGE }}:${VERSION} \
            -t ${{ env.DOCKERHUB_IMAGE }}:latest \
            $(printf '${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)

  # ── Upload tarballs to GitHub Release (release builds only) ──
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [init-skywalking, build-native-linux]
    if: needs.init-skywalking.outputs.is-release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit || github.ref }}
          submodules: true
          fetch-depth: 0

      - name: Generate version metadata
        run: |
          VERSION="${{ needs.init-skywalking.outputs.version }}"
          SW_COMMIT=$(git -C skywalking rev-parse HEAD)
          SW_TAG=$(git -C skywalking describe --tags --exact-match "${SW_COMMIT}" 2>/dev/null || echo "none")
          cat > /tmp/apache-skywalking-graalvm-distro-${VERSION}-version.txt <<EOF
          Version: ${VERSION}
          SkyWalking-Commit: ${SW_COMMIT}
          SkyWalking-Tag: ${SW_TAG}
          Build-Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Download all native tarballs
        uses: actions/download-artifact@v5
        with:
          path: /tmp/tarballs
          pattern: native-tarball-*
          merge-multiple: true

      - name: Collect release files and generate checksums
        run: |
          cp /tmp/apache-skywalking-graalvm-distro-*-version.txt /tmp/tarballs/
          cd /tmp/tarballs
          for f in *.tar.gz; do
            sha512sum "${f}" > "${f}.sha512"
          done

      - name: Read changelog
        id: changelog
        run: |
          VERSION="${{ needs.init-skywalking.outputs.version }}"
          # Extract only the section for this version from changes.md
          # (from "## {version}" up to the next "## " heading or EOF)
          found=false
          while IFS= read -r line; do
            if [[ "${line}" == "## ${VERSION}" ]]; then
              found=true
            elif [[ "${line}" == "## "* ]] && $found; then
              break
            fi
            $found && echo "${line}"
          done < changes/changes.md > /tmp/release-notes.md
          echo "body-file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.init-skywalking.outputs.version }}
          body_path: ${{ steps.changelog.outputs.body-file }}
          files: /tmp/tarballs/*
