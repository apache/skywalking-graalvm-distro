name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/apache/skywalking-graalvm-distro

jobs:
  license-header:
    name: License Header Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check license headers
        uses: apache/skywalking-eyes/header@main

  # ── Shared: build skywalking submodule and cache .m2/repository ──
  build-skywalking:
    name: Build SkyWalking Submodule
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Compute cache key
        id: cache-key
        run: echo "key=m2-skywalking-$(git -C skywalking rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Maven cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.cache-key.outputs.key }}

      - name: Build SkyWalking submodule
        if: steps.cache.outputs.cache-hit != 'true'
        run: make build-skywalking

  # ── CI: compile, javadoc, test, distro ──
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: build-skywalking
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: ${{ needs.build-skywalking.outputs.cache-key }}

      - name: Compile & Install
        run: make compile

      - name: Javadoc
        run: make javadoc

      - name: Test
        run: make test

      - name: Build distribution
        run: make build-distro

  # ── Native image build per architecture ──
  build-native:
    name: Native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: build-skywalking
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: ${{ needs.build-skywalking.outputs.cache-key }}

      - name: Build native image
        run: make native-image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate distro tarball
        id: dist
        run: echo "path=$(ls oap-graalvm-native/target/oap-graalvm-native-*-native-dist.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.native
          platforms: ${{ matrix.platform }}
          build-args: |
            DIST=${{ steps.dist.outputs.path }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Save Docker image for e2e (amd64 only)
        if: matrix.arch == 'amd64'
        run: |
          docker build -f docker/Dockerfile.native \
            --build-arg DIST=${{ steps.dist.outputs.path }} \
            -t skywalking-oap-native:latest .
          docker save skywalking-oap-native:latest -o /tmp/skywalking-oap-native.tar

      - name: Upload Docker image artifact (amd64 only)
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: skywalking-oap-native-image
          path: /tmp/skywalking-oap-native.tar
          retention-days: 1

  # ── E2E tests using pre-built native image ──
  e2e:
    name: E2E ${{ matrix.test.name }}
    runs-on: ubuntu-latest
    needs: build-native
    timeout-minutes: 30
    env:
      SW_AGENT_JDK_VERSION: 17
    strategy:
      matrix:
        test:
          - name: Simple Java Agent
            case: simple-java-agent
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: skywalking-oap-native-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/skywalking-oap-native.tar

      - name: Run E2E test
        uses: apache/skywalking-infra-e2e@8c21e43e241a32a54bdf8eeceb9099eb27e5e9b4
        with:
          e2e-file: $GITHUB_WORKSPACE/test/e2e/cases/${{ matrix.test.case }}/e2e.yaml

      - name: Upload logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.test.case }}
          path: "${{ env.SW_INFRA_E2E_LOG_DIR }}"

  # ── Merge per-arch images into multi-arch manifest ──
  docker-manifest:
    name: Docker Manifest
    runs-on: ubuntu-latest
    needs: build-native
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:${SHORT_SHA} \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
