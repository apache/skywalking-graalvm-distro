name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to release (leave empty for latest on current branch)'
        required: false
        default: ''
      version:
        description: 'Version label for artifacts (e.g. 1.0.0-rc1). Required for manual trigger.'
        required: true

env:
  IMAGE: ghcr.io/apache/skywalking-graalvm-distro
  # Resolve version once: tag-push strips 'v' prefix; manual trigger uses input
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
  # Resolve ref: manual trigger uses input commit (or empty for branch HEAD)
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit || '' }}

jobs:
  # ── Shared: init skywalking submodule and cache .m2/repository ──
  init-skywalking:
    name: Init SkyWalking Submodule
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF || github.ref }}
          submodules: recursive

      - name: Resolve version
        id: version
        run: |
          if [[ -n "${{ env.RELEASE_VERSION }}" ]]; then
            echo "version=${{ env.RELEASE_VERSION }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Compute cache key
        id: cache-key
        run: echo "key=m2-skywalking-$(git -C skywalking rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Maven cache
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ steps.cache-key.outputs.key }}

      - name: Install SkyWalking submodule to Maven cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: make init-skywalking

  # ── Native image build per architecture ──
  build-native:
    name: Native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: init-skywalking
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF || github.ref }}
          submodules: recursive

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Restore Maven cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: ${{ needs.init-skywalking.outputs.cache-key }}

      - name: Build native image
        run: make native-image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate distro tarball
        id: dist
        run: echo "path=$(ls oap-graalvm-native/target/oap-graalvm-native-*-native-dist.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.native
          platforms: ${{ matrix.platform }}
          build-args: |
            DIST=${{ steps.dist.outputs.path }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Rename tarball with arch and version
        id: rename
        run: |
          VERSION="${{ needs.init-skywalking.outputs.version }}"
          SRC=$(ls oap-graalvm-native/target/oap-graalvm-native-*-native-dist.tar.gz)
          DEST="oap-graalvm-native/target/apache-skywalking-graalvm-distro-${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          cp "${SRC}" "${DEST}"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Upload digest
        uses: actions/upload-artifact@v5
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload native tarball
        uses: actions/upload-artifact@v5
        with:
          name: native-tarball-${{ matrix.arch }}
          path: ${{ steps.rename.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  # ── Merge per-arch images into multi-arch manifest with version tag ──
  docker-manifest:
    name: Docker Manifest
    runs-on: ubuntu-latest
    needs: [init-skywalking, build-native]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          VERSION="${{ needs.init-skywalking.outputs.version }}"
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${VERSION} \
            -t ${{ env.IMAGE }}:latest \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

  # ── Upload tarballs to GitHub Release ──
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [init-skywalking, build-native]
    permissions:
      contents: write
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF || github.ref }}
          submodules: true
          fetch-depth: 0

      - name: Generate version metadata
        run: |
          VERSION="${{ needs.init-skywalking.outputs.version }}"
          SW_COMMIT=$(git -C skywalking rev-parse HEAD)
          SW_TAG=$(git -C skywalking describe --tags --exact-match "${SW_COMMIT}" 2>/dev/null || echo "none")
          cat > /tmp/apache-skywalking-graalvm-distro-${VERSION}-version.txt <<EOF
          Version: ${VERSION}
          SkyWalking-Commit: ${SW_COMMIT}
          SkyWalking-Tag: ${SW_TAG}
          Build-Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Download native tarballs
        uses: actions/download-artifact@v5
        with:
          path: /tmp/tarballs
          pattern: native-tarball-*
          merge-multiple: true

      - name: Collect release files and generate checksums
        run: |
          cp /tmp/apache-skywalking-graalvm-distro-*-version.txt /tmp/tarballs/
          cd /tmp/tarballs
          for f in *.tar.gz; do
            sha512sum "${f}" > "${f}.sha512"
          done

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.init-skywalking.outputs.version }}
          files: /tmp/tarballs/*
          generate_release_notes: true
