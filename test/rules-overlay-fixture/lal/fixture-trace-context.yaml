# A value read through a call the compiler cannot type: without a traceContext field in the log body, the def falls back
# to the log's own trace context, whose otlpSpanId the runtime reads by reflection (registered for the native image
# whatever the rules' input types).
rules:
  - name: fixture-trace-context
    layer: GENERAL
    dsl: |
      filter {
        json {
          abortOnFailure false
        }
        extractor {
          def tc = parsed.getMap().getOrDefault("traceContext", log.traceContext)
          tag span: tc.otlpSpanId
        }
        sink {}
      }
