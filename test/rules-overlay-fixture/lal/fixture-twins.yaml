# Rules on one line that share a name, each in another layer, as upstream accepts them. The first two are compiled
# apart by the input type upstream resolves for their layer (MESH logs arrive as Envoy access log entries); of the
# other two, the one of a layer nothing registers is skipped at boot and the other is compiled.
rules: [{name: fixture-twin, layer: FIXTURE, dsl: "filter { text {} sink {} }"}, {name: fixture-twin, layer: MESH, dsl: "filter { text {} sink {} }"}, {name: fixture-skipped-twin, layer: FIXTURE_UNREGISTERED, dsl: "filter { sink {} }"}, {name: fixture-skipped-twin, layer: FIXTURE, dsl: "filter { sink {} }"}]
