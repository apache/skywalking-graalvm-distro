# Two OTLP rules on one line that share a name, each in another layer and with another DSL text, as upstream accepts
# them: the build compiles both, and the boot tells them apart by their text.
rules: [{name: fixture-twin, layer: FIXTURE, inputType: otlp, dsl: "filter { persist {} }"}, {name: fixture-twin, layer: FIXTURE_TRACE, inputType: otlp, dsl: "filter { abort {} }"}]
