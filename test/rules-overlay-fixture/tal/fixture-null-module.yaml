# requiredModules naming a null module: upstream's module manager has no such module, so the boot skips the file, and
# the build compiles none of it and registers none of its layers.
requiredModules: [null]
layerDefinitions:
  - name: FIXTURE_NULL_MODULE
    ordinal: 1006
rules:
  - name: fixture-null-module-calls
    layer: FIXTURE_NULL_MODULE
    inputType: otlp
    dsl: |
      filter {
        extractor {
          def svc = service(meta.service, meta.layer)
          metrics { name "null_module_calls"; scope svc; function cpm; value 1 }
        }
      }
