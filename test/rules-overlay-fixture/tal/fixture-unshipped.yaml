# A TAL file requiring a module the image does not ship (the runtime rule module, which a stand-in replaces): upstream's
# boot never loads it, so the build compiles none of it and registers none of its layers.
requiredModules:
  - receiver-runtime-rule
layerDefinitions:
  - name: FIXTURE_UNSHIPPED
    ordinal: 1002
rules:
  - name: fixture-unshipped-calls
    layer: FIXTURE_UNSHIPPED
    inputType: otlp
    dsl: |
      filter {
        extractor {
          def svc = service(meta.service, meta.layer)
          metrics { name "unshipped_calls"; scope svc; function cpm; value 1 }
        }
      }
