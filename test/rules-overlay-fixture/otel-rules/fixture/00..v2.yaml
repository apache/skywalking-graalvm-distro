# A rule file whose name the rules stager accepts and upstream's runtime-rule read routes refuse (HTTP 400, as a name
# with ".."): the read-only rule catalog answers it as upstream's does.
expSuffix: service(['service'], Layer.FIXTURE)
metricPrefix: meter_fixture_dots
metricsRules:
  - name: calls
    exp: fixture_dots_calls.sum(['service'])
