# The same metric twice on one line, as upstream accepts it: both ask for one expression at one coordinate, which the
# image compiles once.
expSuffix: service(['service'], Layer.FIXTURE)
metricPrefix: meter_fixture_twins
metricsRules: [{name: calls, exp: "fixture_twin_calls.sum(['service'])"}, {name: calls, exp: "fixture_twin_calls.sum(['service'])"}]
