# Upstream's TAL live-debug flow over the SkyWalking agent segments (test/e2e-v2/cases/dsl-debugging/tal-native):
# its emitter reports segments, and the flow lists the native TAL rules (/runtime/tal/*) and drives statement and
# block sessions over the bundled native-segment and virtual rules through `swctl admin dsl-debug`. It needs no
# runtime-rule seed, so it runs unchanged against the native image, whose pre-compiled TAL classes carry the probes.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 25m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl
    - name: install jq
      command: |
        if ! command -v jq >/dev/null 2>&1; then
          curl -fsSL -o /tmp/skywalking-infra-e2e/bin/jq \
            https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
          chmod +x /tmp/skywalking-infra-e2e/bin/jq
        fi

verify:
  retry:
    count: 1
    interval: 1s
  cases:
    - query: OAP_HOST=${oap_host} OAP_REST_PORT=${oap_17128} bash skywalking/test/e2e-v2/cases/dsl-debugging/tal-native/dsl-debug-flow.sh && swctl --display json --admin-url=http://${oap_host}:${oap_17128} admin dsl-debug status >/dev/null && echo ok
      expected: ../../../../skywalking/test/e2e-v2/cases/dsl-debugging/tal-native/expected/ok.txt
