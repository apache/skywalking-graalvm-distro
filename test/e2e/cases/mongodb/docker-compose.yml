services:
  banyandb:
    extends:
      file: ../../../../skywalking/test/e2e-v2/script/docker-compose/base-compose.yml
      service: banyandb
    ports:
      - 17912

  oap:
    image: skywalking-oap-native:latest
    expose:
      - 11800
      - 12800
    networks:
      - e2e
    ports:
      - 12800
    environment:
      SW_HEALTH_CHECKER: default
      SW_STORAGE_BANYANDB_TARGETS: banyandb:17912
      SW_CONFIGURATION: none
    depends_on:
      banyandb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -nz 127.0.0.1 11800 || exit 1"]
      interval: 5s
      timeout: 60s
      retries: 120

  mongodb-1: &mongodb
    image: mongo:6.0.8
    networks:
      - e2e
    command: mongod --replSet rs1 --shardsvr --port 27017
    healthcheck:
      test: [ "CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/27017" ]
      interval: 10s
      timeout: 10s
      retries: 120
  mongodb-2: *mongodb
  mongodb-repl-setup:
    image: mongo:6.0.8
    networks:
      - e2e
    depends_on:
      mongodb-1:
        condition: service_healthy
      mongodb-2:
        condition: service_healthy
    volumes:
      - ../../../../skywalking/test/e2e-v2/cases/mongodb/setup.sh:/setup.sh
    entrypoint: [ "bash", "/setup.sh" ]
  mongodb-exporter-1:
    image: percona/mongodb_exporter:0.39
    expose:
      - 9216
    networks:
      - e2e
    depends_on:
      mongodb-1:
        condition: service_healthy
    command:
      - '--mongodb.uri=mongodb://mongodb-1:27017'
      - '--discovering-mode'
      - '--compatible-mode'
      - '--collector.dbstats'
      - '--collector.diagnosticdata'
      - '--collector.replicasetstatus'
  mongodb-exporter-2:
    image: percona/mongodb_exporter:0.39
    expose:
      - 9216
    networks:
      - e2e
    depends_on:
      mongodb-2:
        condition: service_healthy
    command:
      - '--mongodb.uri=mongodb://mongodb-2:27017'
      - '--discovering-mode'
      - '--compatible-mode'
      - '--collector.dbstats'
      - '--collector.diagnosticdata'
      - '--collector.replicasetstatus'
  otel-collector:
    image: otel/opentelemetry-collector:${OTEL_COLLECTOR_VERSION}
    networks:
      - e2e
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ../../../../skywalking/test/e2e-v2/cases/mongodb/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    expose:
      - 55678
    depends_on:
      oap:
        condition: service_healthy
      mongodb-exporter-1:
        condition: service_started
      mongodb-exporter-2:
        condition: service_started

networks:
  e2e:
