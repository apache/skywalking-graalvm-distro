# Log E2E — native OAP with BanyanDB
# Tests receiver-log, LAL engine, and log query via GraphQL.
# Uses the built-in default LAL config (custom test LAL scripts are
# compiled into the native binary at build time and cannot be mounted).

setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl

trigger:
  action: http
  interval: 3s
  times: -1
  url: http://${provider_host}:${provider_9090}/logs/trigger
  method: GET

verify:
  retry:
    count: 20
    interval: 10s
  cases:
    # service list
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql service layer GENERAL
      expected: ../../../../skywalking/test/e2e-v2/cases/log/expected/service.yml
    # service endpoint
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql endpoint list --keyword=logs --service-name=e2e-service-provider
      expected: ../../../../skywalking/test/e2e-v2/cases/log/expected/service-endpoint.yml
    # service instance list
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql instance list --service-name=e2e-service-provider
      expected: ../../../../skywalking/test/e2e-v2/cases/log/expected/service-instance.yml
    - query: |
        swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql logs list --service-name=e2e-service-provider --tags level=INFO --trace-id=$( \
            swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql tv2 ls | yq e '.traces | map(select(.spans[0].endpointname == "GET:/logs/trigger")) | .[0].spans[0].traceid' -
        )
      expected: ../../../../skywalking/test/e2e-v2/cases/log/expected/logs.yml
