# AI agent conversations E2E — native OAP with BanyanDB.
# The cases mirror upstream test/e2e-v2/cases/ai-agent/ai-agent-cases.yaml one for one. They are
# inlined because upstream's queries call verify.sh by an upstream-root-relative path; the script and
# every expected file are still upstream's, so the assertions track upstream.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl

verify:
  retry:
    count: 30
    interval: 10s
  cases:
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql service layer AI_AGENT
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/service.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql instance list --service-name="e2e-ai-agent"
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/instance.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh list http://${oap_host}:${oap_12800}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/conversations.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh list-limit http://${oap_host}:${oap_12800}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/conversations-limit.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh list-instance http://${oap_host}:${oap_12800}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/conversations-instance.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh list-window http://${oap_host}:${oap_12800}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/conversations-window.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh list-filters http://${oap_host}:${oap_12800}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/conversations-filters.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh views http://${oap_host}:${oap_12800} http://${aszview_host}:${aszview_8787}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/views.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh list-horizon http://${oap_host}:${oap_12800}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/list-horizon.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh view-horizon http://${oap_host}:${oap_12800}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/view-horizon.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh raw-files http://${oap_host}:${oap_12800}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/raw-files.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh reject http://${oap_host}:${oap_12800}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/reject.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh multi-round http://${oap_host}:${oap_12800}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/multi-round.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh lost-file http://${oap_host}:${oap_12800}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/lost-file.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh gap http://${oap_host}:${oap_12800}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/gap.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh size http://${oap_host}:${oap_12800}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/size.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh changes http://${oap_host}:${oap_12800}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/changes.yml
    - query: bash skywalking/test/e2e-v2/cases/ai-agent/verify.sh metrics http://${oap_host}:${oap_12800}
      expected: ../../../../skywalking/test/e2e-v2/cases/ai-agent/expected/metrics.yml
