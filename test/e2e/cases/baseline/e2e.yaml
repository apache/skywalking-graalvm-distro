# Baseline Predictor E2E — native OAP with BanyanDB + skypredictor
# Verifies baseline alarm rule with mock metric sender.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl
    - name: build mock sender
      command: |
        cd skywalking && ./mvnw -B -q -f test/e2e-v2/java-test-service/pom.xml clean package -DskipTests

trigger:
  action: http
  interval: 3s
  times: -1
  url: http://${provider_host}:${provider_9090}/users
  method: POST
  body: '{"id":"123","name":"skywalking"}'
  headers:
    "Content-Type": "application/json"

verify:
  retry:
    count: 20
    interval: 3s
  cases:
    - includes:
        - ../../../../skywalking/test/e2e-v2/cases/baseline/alarm-cases.yaml
