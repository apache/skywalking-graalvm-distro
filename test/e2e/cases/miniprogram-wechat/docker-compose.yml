services:
  banyandb:
    extends:
      file: ../../../../skywalking/test/e2e-v2/script/docker-compose/base-compose.yml
      service: banyandb
    ports:
      - 17912

  oap:
    image: skywalking-oap-native:latest
    expose:
      - 11800
      - 12800
    networks:
      - e2e
    ports:
      - 12800
    environment:
      SW_HEALTH_CHECKER: default
      SW_STORAGE_BANYANDB_TARGETS: banyandb:17912
      SW_CONFIGURATION: none
      SW_OTEL_RECEIVER: default
      SW_OTEL_RECEIVER_ENABLED_HANDLERS: "otlp-traces,otlp-metrics,otlp-logs"
      SW_OTEL_RECEIVER_ENABLED_OTEL_METRICS_RULES: "miniprogram/wechat-mini-program,miniprogram/wechat-mini-program-instance"
      SW_LOG_LAL_FILES: "miniprogram,default"
      SW_LOG_MAL_FILES: "miniprogram-wechat"
      SW_LOG_ANALYZER: default
    depends_on:
      banyandb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -nz 127.0.0.1 11800 || exit 1"]
      interval: 5s
      timeout: 60s
      retries: 120

  # The SkyAPM mini-program-monitor simulator (published image): OTLP logs + metrics and SkyWalking native
  # segments against the OAP for 60 s, then it exits.
  sim-wechat:
    image: ghcr.io/skyapm/mini-program-monitor/sim-wechat:v0.4.1
    depends_on:
      oap:
        condition: service_healthy
    environment:
      MODE: timed
      DURATION_MS: 60000
      SCENARIO: demo
      COLLECTOR_URL: http://oap:12800
      TRACE_COLLECTOR_URL: http://oap:12800
      SERVICE_INSTANCE: sim
    networks:
      - e2e

networks:
  e2e:
