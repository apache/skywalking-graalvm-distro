# The rules the rules-overlay e2e case compiles into the native image, as a downstream repository does: one rule of
# each DSL of its own, under a layer of its own, and only some of the bundled rules. CI copies this directory out of
# the checkout and builds with RULES_OVERLAY pointing at the copy.
add:
  - otel-rules/overlay/overlay-service.yaml
  - lal/overlay.yaml
  - tal/overlay.yaml
  - oal/overlay.oal
override:
  - layer-extensions.yml
exclude:
  # Every bundled MAL rule.
  - "otel-rules/**"
  - "meter-analyzer-config/*"
  - "log-mal-rules/*"
  - "envoy-metrics-rules/*"
  - "telegraf-rules/*"
  - "zabbix-rules/*"
  # Every bundled LAL rule file but default.yaml.
  - "lal/[!d]*.yaml"
  # Every bundled OAL script but core.oal (which the bundled alarm rules use) and disable.oal.
  - oal/browser.oal
  - oal/cilium.oal
  - oal/dotnet-agent.oal
  - oal/ebpf.oal
  - oal/java-agent.oal
  - oal/mesh.oal
  - oal/tcp.oal
  - oal/virtual-gen-ai.oal
  # The OTLP AI evaluation rules: otlp-general.yaml and the native files that analyze agent segments stay.
  - tal/otlp-ai-evaluation.yaml
