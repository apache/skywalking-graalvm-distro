# TAL: the calls of the OTLP spans of the overlay's layer.
metricPrefix: overlay
rules:
  - name: overlay-calls
    layer: OVERLAY_E2E
    inputType: otlp
    dsl: |
      filter {
        extractor {
          def svc = service(meta.service, meta.layer)
          metrics { name "calls"; scope svc; function cpm; value 1 }
        }
      }
