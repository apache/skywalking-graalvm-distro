# A native image compiled with the rules in rules/ (RULES_OVERLAY): its own MAL, LAL, TAL and OAL rules run, the bundled
# rules it kept run, and those it excluded do not exist.
setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl

verify:
  retry:
    count: 30
    interval: 10s
  cases:
    # The overlay's layer, with the services its MAL and TAL rules report.
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql service layer OVERLAY_E2E
      expected: expected/service.yml
    # MAL: otel-rules/overlay/overlay-service.yaml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=meter_overlay_requests --service-name=overlay-mal-svc
      expected: ../../../../skywalking/test/e2e-v2/cases/vm/expected/metrics-has-value.yml
    # TAL: tal/overlay.yaml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=overlay_calls --service-name=overlay-tal-svc
      expected: ../../../../skywalking/test/e2e-v2/cases/vm/expected/metrics-has-value.yml
    # LAL: lal/overlay.yaml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql logs list --service-name=overlay-tal-svc
      expected: expected/logs.yml
    # OAL: oal/overlay.oal, over the services the kept bundled native TAL rules find in agent segments
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=overlay_service_cpm --service-name=overlay-native-svc
      expected: ../../../../skywalking/test/e2e-v2/cases/vm/expected/metrics-has-value.yml
    # The kept bundled core.oal, over the same services
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=service_cpm --service-name=overlay-native-svc
      expected: ../../../../skywalking/test/e2e-v2/cases/vm/expected/metrics-has-value.yml
    # The excluded bundled rules: no metric of otel-rules/vm.yaml, otel-rules/oap.yaml, tcp.oal or browser.oal
    - query: |
        curl -s -X POST http://${oap_host}:${oap_12800}/graphql -H 'Content-Type: application/json' \
          -d '{"query":"{ listMetrics(regex: \"meter_vm_cpu_total_percentage|meter_oap_instance_cpu_percentage|service_throughput_received|browser_app_pv\") { name } }"}' \
          | yq e '.data' -P -
      expected: expected/no-excluded-metrics.yml
