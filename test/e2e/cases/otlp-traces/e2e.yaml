# OTLP Traces E2E — native OAP with BanyanDB
# Validates OpenTelemetry trace ingestion via OTLP and query via Zipkin API.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl

trigger:
  action: http
  interval: 3s
  times: -1
  url: http://${frontend_host}:${frontend_8080}/api/products
  method: GET

verify:
  retry:
    count: 20
    interval: 10s
  cases:
    # service name
    - query: curl http://${oap_host}:${oap_9412}/zipkin/api/v2/services
      expected: ../../../../skywalking/test/e2e-v2/cases/otlp-traces/expected/service-name.yml
    # remote-service name
    - query: curl http://${oap_host}:${oap_9412}/zipkin/api/v2/remoteServices?serviceName=frontend
      expected: ../../../../skywalking/test/e2e-v2/cases/otlp-traces/expected/remote-service-name.yml
    # span name
    - query: curl http://${oap_host}:${oap_9412}/zipkin/api/v2/spans?serviceName=productcatalogservice
      expected: ../../../../skywalking/test/e2e-v2/cases/otlp-traces/expected/span-name.yml
    # traces
    - query: curl http://${oap_host}:${oap_9412}/zipkin/api/v2/traces\?limit\=1\&serviceName\=productcatalogservice\&spanName\=oteldemo.productcatalogservice/listproducts | yq e 'del(..|.tags?, ..|.annotations?)' -
      expected: ../../../../skywalking/test/e2e-v2/cases/otlp-traces/expected/traces.yml
    # autocomplete
    - query: curl http://${oap_host}:${oap_9412}/zipkin/api/v2/autocompleteValues?key=http.method
      expected: ../../../../skywalking/test/e2e-v2/cases/otlp-traces/expected/autocomplete.yml
