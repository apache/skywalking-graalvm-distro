services:
  banyandb:
    extends:
      file: ../../../../skywalking/test/e2e-v2/script/docker-compose/base-compose.yml
      service: banyandb
    ports:
      - 17912

  oap:
    image: skywalking-oap-native:latest
    expose:
      - 11800
      - 12800
    networks:
      - e2e
    ports:
      - 12800
    environment:
      SW_HEALTH_CHECKER: default
      SW_STORAGE_BANYANDB_TARGETS: banyandb:17912
      SW_CONFIGURATION: none
    depends_on:
      banyandb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -nz 127.0.0.1 11800 || exit 1"]
      interval: 5s
      timeout: 60s
      retries: 120

  amq:
    image: apache/activemq-classic:6.0.1
    hostname: amq
    ports:
      - "61616:61616"
      - "8161:8161"
    expose:
      - 1616
    volumes:
      - ../../../../skywalking/test/e2e-v2/cases/activemq/config/amq/activemq.xml:/opt/apache-activemq/conf/activemq.xml
    environment:
      ACTIVEMQ_SUNJMX_START: "-Dcom.sun.management.jmxremote.port=1616 -Dcom.sun.management.jmxremote.rmi.port=1616 -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.authenticate=false"
      ACTIVEMQ_BROKER_NAME: activemq-broker
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent --fail localhost:8161 || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 120
    networks:
      - e2e

  amqexporter:
    image: bitnamilegacy/jmx-exporter:0.20.0
    hostname: amqexporter
    volumes:
      - ../../../../skywalking/test/e2e-v2/cases/activemq/config/amq/config.yaml:/opt/bitnami/jmx-exporter/example_configs/httpserver_sample_config.yml
    expose:
      - 5556
    depends_on:
      - amq
    networks:
      - e2e

  amq-consumer-mock:
    image: apache/activemq-classic:6.0.1
    hostname: amq-consumer-mock
    entrypoint: bash
    command:
      - -c
      - "/opt/apache-activemq/bin/activemq consumer --brokerUrl tcp://amq:61616 --destination queue://testQueue --messageCount 10 --parallelThreads 2 && /opt/apache-activemq/bin/activemq consumer --brokerUrl tcp://amq:61616 --destination topic://testTopic --messageCount 10 --parallelThreads 2"
    depends_on:
      amq:
        condition: service_healthy
    networks:
      - e2e

  amq-producer-mock:
    image: apache/activemq-classic:6.0.1
    hostname: amq-producer-mock
    entrypoint: bash
    command:
      - -c
      - "/opt/apache-activemq/bin/activemq producer --brokerUrl tcp://amq:61616 --destination queue://testQueue --messageCount 50 --persistent true --message hello && /opt/apache-activemq/bin/activemq producer --brokerUrl tcp://amq:61616 --destination topic://testTopic --messageCount 50 --persistent true --message world"
    depends_on:
      - amq-consumer-mock
    networks:
      - e2e

  otel-collector:
    image: otel/opentelemetry-collector:${OTEL_COLLECTOR_VERSION}
    networks:
      - e2e
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ../../../../skywalking/test/e2e-v2/cases/activemq/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    expose:
      - 55678
    depends_on:
      oap:
        condition: service_healthy

networks:
  e2e:
