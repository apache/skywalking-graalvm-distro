# Simple Java Agent E2E — native OAP with BanyanDB
# Reuses upstream verification cases and expected files.

# Upstream test/e2e-v2/cases/airflow/mock against the native image: a small python sender
# replays recorded Airflow OTLP metrics into the OAP; no real Airflow cluster is needed.
services:
  banyandb:
    extends:
      file: ../../../../skywalking/test/e2e-v2/script/docker-compose/base-compose.yml
      service: banyandb
    ports:
      - 17912

  oap:
    image: skywalking-oap-native:latest
    expose:
      - 11800
      - 12800
    networks:
      - e2e
    ports:
      - 12800
    environment:
      SW_HEALTH_CHECKER: default
      SW_STORAGE_BANYANDB_TARGETS: banyandb:17912
      SW_CONFIGURATION: none
      SW_OTEL_RECEIVER_ENABLED_OTEL_METRICS_RULES: "airflow/*"
    depends_on:
      banyandb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -nz 127.0.0.1 11800 || exit 1"]
      interval: 5s
      timeout: 60s
      retries: 120

  sender:
    build:
      context: ../../../../skywalking/test/e2e-v2/cases/airflow/mock
      dockerfile: Dockerfile.mock-sender
      args:
        PYTHON_IMAGE: python:3.11-slim
    volumes:
      - ../../../../skywalking/test/e2e-v2/cases/airflow/mock/mock-data:/data/otel-metrics:ro
    environment:
      OAP_HOST: oap
      OAP_GRPC_PORT: 11800
      OTEL_METRICS_DATA_PATH: /data/otel-metrics
    networks:
      - e2e
    ports:
      - 9093
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -nz 127.0.0.1 9093"]
      interval: 5s
      timeout: 60s
      retries: 120
    depends_on:
      oap:
        condition: service_healthy

networks:
  e2e:
