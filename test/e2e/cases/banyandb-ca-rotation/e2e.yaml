# BanyanDB TLS trust CA hot-reload E2E — native OAP.
# The rotation steps are upstream's (test/e2e-v2/cases/storage/banyandb/ca-rotation/e2e.yaml):
# rotate the trust file to an unrelated CA (the rebuilt channel must be rejected), then back, then
# run the shared storage suite against the reconnected OAP.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl

trigger:
  action: http
  interval: 5s
  times: -1
  url: http://${consumer_host}:${consumer_9092}/users
  method: POST
  body: '{"id":"123","name":"skywalking"}'
  headers:
    "Content-Type": "application/json"

verify:
  retry:
    count: 20
    interval: 10s
  cases:
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql service layer GENERAL
      expected: ../../../../skywalking/test/e2e-v2/cases/storage/expected/service.yml

    - query: |
        oap=$(docker ps -q --filter label=com.docker.compose.service=oap)
        docker exec $oap bash -c 'cat /tls-src-wrong/wrong-ca.crt > /tmp/bydb-ca.crt'
        docker logs $oap 2>&1 \
          | grep -Fq "Rebuilt the BanyanDB channel to reload the TLS trust CA from /tmp/bydb-ca.crt" \
          && docker logs $oap 2>&1 | grep -Fq "PKIX path building failed" \
          && echo ca-rejected
      expected: ../../../../skywalking/test/e2e-v2/cases/storage/banyandb/ca-rotation/expected/ca-rejected.yml

    - query: |
        oap=$(docker ps -q --filter label=com.docker.compose.service=oap)
        docker exec $oap bash -c 'cat /tls-src/cert.crt > /tmp/bydb-ca.crt'
        [ "$(docker logs $oap 2>&1 | grep -Fc 'Rebuilt the BanyanDB channel')" -ge 2 ] \
          && echo ca-restored
      expected: ../../../../skywalking/test/e2e-v2/cases/storage/banyandb/ca-rotation/expected/ca-restored.yml

    - includes:
        - ../../../../skywalking/test/e2e-v2/cases/storage/storage-cases.yaml
