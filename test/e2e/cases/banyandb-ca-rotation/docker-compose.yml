# Upstream test/e2e-v2/cases/storage/banyandb/ca-rotation against the native image: BanyanDB over
# TLS, the OAP rebuilding its gRPC channel when SW_STORAGE_BANYANDB_SSL_TRUST_CA_PATH is rotated.
services:
  banyandb:
    extends:
      file: ../../../../skywalking/test/e2e-v2/script/docker-compose/base-compose.yml
      service: banyandb
    volumes:
      - ../../../../skywalking/test/e2e-v2/cases/storage/banyandb/tls/tls:/tls
    command: standalone --tls=true --key-file=/tls/cert.key --cert-file=/tls/cert.crt --http-grpc-cert-file=/tls/ca.crt
    networks:
      - e2e

  oap:
    image: skywalking-oap-native:latest
    expose:
      - 11800
      - 12800
      - 17128
    networks:
      - e2e
    ports:
      - 12800
      - 17128
    volumes:
      - ../../../../skywalking/test/e2e-v2/cases/storage/banyandb/tls/tls:/tls-src:ro
      - ../../../../skywalking/test/e2e-v2/cases/storage/banyandb/ca-rotation/wrong-ca.crt:/tls-src-wrong/wrong-ca.crt:ro
    # TLS is only enabled when the trust file exists at boot, and the test rewrites it, so it is
    # seeded into /tmp before the image's normal command line takes over.
    entrypoint: ["/bin/sh", "-c", "cp /tls-src/cert.crt /tmp/bydb-ca.crt && exec ./oap-server -Dlog4j2.configurationFile=config/log4j2.xml"]
    environment:
      SW_HEALTH_CHECKER: default
      SW_CONFIGURATION: none
      SW_STORAGE_BANYANDB_TARGETS: banyandb:17912
      SW_STORAGE_BANYANDB_SSL_TRUST_CA_PATH: /tmp/bydb-ca.crt
    depends_on:
      banyandb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -nz 127.0.0.1 11800 || exit 1"]
      interval: 5s
      timeout: 60s
      retries: 120

  provider-jar:
    image: "ghcr.io/apache/skywalking/e2e-service-provider:${SW_E2E_SERVICE_COMMIT}"
    entrypoint: ["cp", "/app.jar", "/jars/services_provider.jar"]
    volumes:
      - service-jars:/jars
    networks:
      - e2e

  consumer-jar:
    image: "ghcr.io/apache/skywalking/e2e-service-consumer:${SW_E2E_SERVICE_COMMIT}"
    entrypoint: ["cp", "/app.jar", "/jars/services_consumer.jar"]
    volumes:
      - service-jars:/jars
    networks:
      - e2e

  provider:
    image: "ghcr.io/apache/skywalking-java/skywalking-java:${SW_AGENT_JAVA_COMMIT}-java${SW_AGENT_JDK_VERSION}"
    command: ["java", "-jar", "/jars/services_provider.jar"]
    volumes:
      - service-jars:/jars
    networks:
      - e2e
    expose:
      - 9090
    ports:
      - 9090
    environment:
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: oap:11800
      SW_LOGGING_OUTPUT: CONSOLE
      SW_AGENT_NAME: e2e-service-provider
      SW_AGENT_INSTANCE_NAME: provider1
      SW_AGENT_COLLECTOR_GET_PROFILE_TASK_INTERVAL: 1
      SW_AGENT_COLLECTOR_GET_AGENT_DYNAMIC_CONFIG_INTERVAL: 1
      SW_METER_ACTIVE: 'false'
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/9090"]
      interval: 5s
      timeout: 60s
      retries: 120
    depends_on:
      oap:
        condition: service_healthy
      provider-jar:
        condition: service_completed_successfully

  consumer:
    image: "ghcr.io/apache/skywalking-java/skywalking-java:${SW_AGENT_JAVA_COMMIT}-java${SW_AGENT_JDK_VERSION}"
    command: ["java", "-jar", "/jars/services_consumer.jar"]
    volumes:
      - service-jars:/jars
    networks:
      - e2e
    expose:
      - 9092
    ports:
      - 9092
    environment:
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: oap:11800
      SW_LOGGING_OUTPUT: CONSOLE
      PROVIDER_URL: http://provider:9090
      SW_AGENT_NAME: e2e-service-consumer
      SW_AGENT_INSTANCE_NAME: consumer1
      SW_AGENT_COLLECTOR_GET_PROFILE_TASK_INTERVAL: 1
      SW_AGENT_COLLECTOR_GET_AGENT_DYNAMIC_CONFIG_INTERVAL: 1
      SW_METER_ACTIVE: 'false'
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/9092"]
      interval: 5s
      timeout: 60s
      retries: 120
    depends_on:
      provider:
        condition: service_healthy
      consumer-jar:
        condition: service_completed_successfully

volumes:
  service-jars:

networks:
  e2e:
