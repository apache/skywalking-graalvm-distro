# Istio ALS + K8s cluster + BanyanDB e2e test for GraalVM native OAP.

setup:
  env: kind
  file: kind.yaml
  init-system-environment: ../../script/env
  kind:
    expose-ports:
      - namespace: istio-system
        resource: service/skywalking-oap
        port: 12800
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl
    - name: install kubectl
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh kubectl
    - name: pull images
      command: |
        pull_or_cache() { docker pull "$1" || docker image inspect "$1" > /dev/null 2>&1; }
        docker pull ghcr.io/apache/skywalking-banyandb:$SW_BANYANDB_COMMIT
        pull_or_cache docker.io/istio/pilot:$ISTIO_VERSION
        pull_or_cache docker.io/istio/proxyv2:$ISTIO_VERSION
        pull_or_cache curlimages/curl:latest
        pull_or_cache alpine/curl:8.9.1
        pull_or_cache docker.io/istio/examples-bookinfo-productpage-v1:1.20.2
        pull_or_cache docker.io/istio/examples-bookinfo-details-v1:1.20.2
        pull_or_cache docker.io/istio/examples-bookinfo-reviews-v1:1.20.2
        pull_or_cache docker.io/istio/examples-bookinfo-reviews-v2:1.20.2
        pull_or_cache docker.io/istio/examples-bookinfo-reviews-v3:1.20.2
        pull_or_cache docker.io/istio/examples-bookinfo-ratings-v1:1.20.2
        pull_or_cache docker.io/istio/examples-bookinfo-ratings-v2:1.20.2
        pull_or_cache docker.io/istio/examples-bookinfo-mongodb:1.20.2
    - name: load images into kind
      command: |
        kind load docker-image skywalking-oap-native:latest
        kind load docker-image istio/pilot:$ISTIO_VERSION
        kind load docker-image istio/proxyv2:$ISTIO_VERSION
        kind load docker-image ghcr.io/apache/skywalking-banyandb:$SW_BANYANDB_COMMIT
        kind load docker-image curlimages/curl:latest
        kind load docker-image alpine/curl:8.9.1
        kind load docker-image docker.io/istio/examples-bookinfo-productpage-v1:1.20.2
        kind load docker-image docker.io/istio/examples-bookinfo-details-v1:1.20.2
        kind load docker-image docker.io/istio/examples-bookinfo-reviews-v1:1.20.2
        kind load docker-image docker.io/istio/examples-bookinfo-reviews-v2:1.20.2
        kind load docker-image docker.io/istio/examples-bookinfo-reviews-v3:1.20.2
        kind load docker-image docker.io/istio/examples-bookinfo-ratings-v1:1.20.2
        kind load docker-image docker.io/istio/examples-bookinfo-ratings-v2:1.20.2
        kind load docker-image docker.io/istio/examples-bookinfo-mongodb:1.20.2
    - name: install istio
      command: |
        bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh istioctl
        istioctl install -y --set profile=demo \
          --set meshConfig.defaultConfig.envoyAccessLogService.address=skywalking-oap.istio-system:11800 \
          --set meshConfig.enableEnvoyAccessLogService=true
        kubectl label namespace default istio-injection=enabled
    - name: Install helm
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh helm
    - name: Install SkyWalking
      command: |
        helm -n istio-system install skywalking \
          oci://ghcr.io/apache/skywalking-helm/skywalking-helm \
          --version "0.0.0-${SW_KUBERNETES_COMMIT_SHA}" \
          --set fullnameOverride=skywalking \
          --set oap.image.repository=skywalking-oap-native \
          --set oap.image.tag=latest \
          --set oap.image.pullPolicy=IfNotPresent \
          --set oap.replicas=2 \
          --set oap.env.SW_ENVOY_METRIC_ALS_HTTP_ANALYSIS=k8s-mesh \
          --set oap.env.SW_ENVOY_METRIC_ALS_TCP_ANALYSIS=k8s-mesh \
          --set oap.env.K8S_SERVICE_NAME_RULE='e2e::${service.metadata.name}' \
          --set oap.env.SW_HEALTH_CHECKER=default \
          --set oap.envoy.als.enabled=true \
          --set oap.storageType=banyandb \
          --set ui.enabled=false \
          --set elasticsearch.enabled=false \
          --set banyandb.enabled=true \
          --set banyandb.image.repository=ghcr.io/apache/skywalking-banyandb \
          --set banyandb.image.tag=$SW_BANYANDB_COMMIT \
          --set banyandb.image.pullPolicy=IfNotPresent \
          --set banyandb.standalone.enabled=true \
          --set banyandb.cluster.enabled=false \
          --set banyandb.etcd.enabled=false \
          -f test/e2e/cases/istio-als/values.yaml
      wait:
        - namespace: istio-system
          resource: deployments/skywalking-oap
          for: condition=available
    - name: Deploy demo services
      command: |
        kubectl apply -f https://raw.githubusercontent.com/istio/istio/$ISTIO_VERSION/samples/bookinfo/platform/kube/bookinfo.yaml
        kubectl apply -f https://raw.githubusercontent.com/istio/istio/$ISTIO_VERSION/samples/bookinfo/networking/bookinfo-gateway.yaml
        # Enable TCP services
        kubectl apply -f https://raw.githubusercontent.com/istio/istio/$ISTIO_VERSION/samples/bookinfo/platform/kube/bookinfo-ratings-v2.yaml
        kubectl apply -f https://raw.githubusercontent.com/istio/istio/$ISTIO_VERSION/samples/bookinfo/platform/kube/bookinfo-db.yaml
        kubectl apply -f https://raw.githubusercontent.com/istio/istio/$ISTIO_VERSION/samples/bookinfo/networking/destination-rule-all.yaml
        kubectl apply -f https://raw.githubusercontent.com/istio/istio/$ISTIO_VERSION/samples/bookinfo/networking/virtual-service-ratings-db.yaml
      wait:
        - namespace: default
          resource: pod
          for: condition=Ready
    - name: Generate traffic
      path: traffic-gen.yaml
      wait:
        - namespace: default
          resource: pod
          for: condition=Ready
  timeout: 25m

verify:
  retry:
    count: 20
    interval: 15s
  cases:
    # service list
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql service ls
      expected: expected/service.yml
    # service instance list
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql instance list --service-name=e2e::productpage
      expected: expected/service-instance.yml
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql instance list --service-name=e2e::reviews
      expected: expected/service-instance.yml
    # service endpoint
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql endpoint list --service-name=e2e::productpage
      expected: expected/service-endpoint-productpage.yml
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql endpoint list --service-name=e2e::reviews
      expected: expected/service-endpoint-reviews.yml

    # service metrics: e2e::productpage
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_sla --service-name=e2e::productpage
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_cpm --service-name=e2e::productpage
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_resp_time --service-name=e2e::productpage
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_apdex --service-name=e2e::productpage
      expected: expected/metrics-has-value.yml
    # service metrics: e2e::reviews
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_sla --service-name=e2e::reviews
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_cpm --service-name=e2e::reviews
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_resp_time --service-name=e2e::reviews
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_apdex --service-name=e2e::reviews
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_sidecar_internal_req_latency_nanos --service-name=e2e::reviews
      expected: expected/metrics-has-value.yml
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_sidecar_internal_resp_latency_nanos --service-name=e2e::reviews
      expected: expected/metrics-has-value.yml
    # service instance metrics: e2e::productpage
    - query: |
        swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_instance_resp_time --service-name=e2e::productpage --instance-name=$( \
          swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql instance list --service-name=e2e::productpage | yq e '.[0].name' -
        )
      expected: expected/metrics-has-value.yml
    - query: |
        swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_instance_cpm --service-name=e2e::productpage --instance-name=$( \
          swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql instance list --service-name=e2e::productpage | yq e '.[0].name' -
        )
      expected: expected/metrics-has-value.yml
    - query: |
        swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_instance_sla --service-name=e2e::productpage --instance-name=$( \
          swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql instance list --service-name=e2e::productpage | yq e '.[0].name' -
        )
      expected: expected/metrics-has-value.yml
    # service instance metrics: e2e::reviews
    - query: |
        swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_instance_resp_time --service-name=e2e::reviews --instance-name=$( \
          swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql instance list --service-name=e2e::reviews | yq e '.[0].name' -
        )
      expected: expected/metrics-has-value.yml
    - query: |
        swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_instance_cpm --service-name=e2e::reviews --instance-name=$( \
          swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql instance list --service-name=e2e::reviews | yq e '.[0].name' -
        )
      expected: expected/metrics-has-value.yml
    - query: |
        swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_instance_sla --service-name=e2e::reviews --instance-name=$( \
          swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql instance list --service-name=e2e::reviews | yq e '.[0].name' -
        )
      expected: expected/metrics-has-value.yml
    - query: |
        swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_instance_sidecar_internal_req_latency_nanos --service-name=e2e::reviews --instance-name=$( \
          swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql instance list --service-name=e2e::reviews | yq e '.[0].name' -
        )
      expected: expected/metrics-has-value.yml
    - query: |
        swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=service_instance_sidecar_internal_resp_latency_nanos --service-name=e2e::reviews --instance-name=$( \
          swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql instance list --service-name=e2e::reviews | yq e '.[0].name' -
        )
      expected: expected/metrics-has-value.yml

    # service endpoint metrics: e2e::productpage GET:/productpage
    - query: swctl --display yaml --base-url=http://${service_skywalking_oap_host}:${service_skywalking_oap_12800}/graphql metrics exec --expression=endpoint_cpm --endpoint-name=GET:/productpage --service-name=e2e::productpage
      expected: expected/metrics-has-value.yml
