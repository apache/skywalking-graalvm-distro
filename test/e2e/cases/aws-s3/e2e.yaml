setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl

trigger:
  action: http
  interval: 3s
  times: -1
  url: http://localhost:9093/otel-metrics/send
  method: GET

verify:
  retry:
    count: 20
    interval: 10s
  cases:
    - includes:
        - ../../../../skywalking/test/e2e-v2/cases/aws/s3/s3-cases.yaml
    # The metrics above arrive over gRPC; an AWS metric stream reaches the OAP through the Firehose receiver, whose
    # JSON body and answer Jackson maps. `AA==` is one empty length-delimited ExportMetricsServiceRequest, `/////w==`
    # no protobuf at all.
    - query: |
        post() {
          curl -s -X POST -H 'Content-Type: application/json' http://${oap_host}:${oap_12801}/aws/firehose/metrics \
            --data '{"requestId":"'"$1"'","timestamp":1700000000000,"records":[{"data":"'"$2"'"}]}' \
            | yq -p json -o json -I0 '{"requestId": .requestId, "errorMessage": .errorMessage, "timestamped": (.timestamp > 0)}'
        }
        echo "accepted: $(post e2e-accepted AA==)"
        echo "rejected: $(post e2e-rejected /////w==)"
      expected: expected/firehose.yml
