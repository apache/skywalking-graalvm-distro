# Event E2E — native OAP with BanyanDB
# Tests receiver-event module via gRPC event reporting.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl
    # Upstream's step: no service here waits on OAP's healthcheck, so wait for OAP to answer before verifying.
    - name: wait for OAP
      command: |
        export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
        for i in $(seq 1 100); do
          swctl --base-url=http://${oap_host}:${oap_12800}/graphql service ls > /dev/null 2>&1 && exit 0
          sleep 3
        done
        echo "OAP did not answer within 300s"
        exit 1

verify:
  retry:
    count: 20
    interval: 3s
  cases:
    - includes:
        - ../../../../skywalking/test/e2e-v2/cases/event/event-cases.yaml
