services:
  banyandb:
    extends:
      file: ../../../../skywalking/test/e2e-v2/script/docker-compose/base-compose.yml
      service: banyandb
    ports:
      - 17912

  oap:
    image: skywalking-oap-native:latest
    expose:
      - 11800
      - 12800
      - 9411
    networks:
      - e2e
    ports:
      - 12800
    volumes:
      - ../../../../skywalking/test/e2e-v2/cases/virtual-genai/ai-evaluation.yml:/skywalking/config/ai-evaluation.yml
    environment:
      SW_HEALTH_CHECKER: default
      SW_STORAGE_BANYANDB_TARGETS: banyandb:17912
      SW_CONFIGURATION: none
      SW_QUERY_ZIPKIN: default
      SW_RECEIVER_ZIPKIN: default
      SW_AI_EVALUATION: default
      SW_AI_EVALUATION_SAMPLE_RATE: 1000000
      AI_EVALUATION_ENDPOINT: http://mock-llm-server:9090/llm/evaluation/v1/chat/completions
      AI_EVALUATION_MODEL: e2e-judge
      AI_EVALUATION_API_KEY: e2e-api-key
    depends_on:
      banyandb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -nz 127.0.0.1 11800 || exit 1"]
      interval: 5s
      timeout: 60s
      retries: 120

  # Upstream bind-mounts the jar it builds; the published image carries the same jar.
  mock-llm-server:
    image: "ghcr.io/apache/skywalking/e2e-mock-llm-server:${SW_E2E_SERVICE_COMMIT}"
    networks:
      - e2e
    expose:
      - 9090
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/9090"]
      interval: 5s
      timeout: 60s
      retries: 120

  provider-py:
    build:
      context: ../../../../skywalking/test/e2e-v2/script/
      dockerfile: dockerfile/Dockerfile-openai.python
    networks:
      - e2e
    ports:
      - "9091:9091"
    environment:
      OPENAI_BASE_URL: http://mock-llm-server:9090/llm/otlp/v1
      OPENAI_API_KEY: xxxxxxxxxxxxxxxxxxxxxxxx
      OTEL_TRACES_EXPORTER: zipkin_json
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: http://oap:9411/api/v2/spans
      OTEL_LOG_LEVEL: debug
    depends_on:
      oap:
        condition: service_healthy
      mock-llm-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/"]
      interval: 5s
      timeout: 10s
      retries: 5
    command: ["opentelemetry-instrument", "python3", "/openai-call.py"]

networks:
  e2e:
