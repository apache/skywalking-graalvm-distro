# Upstream mixed-virtual-genai: GenAI evaluation records whose traceRef.type names the store holding the judged
# span (SKYWALKING_NATIVE, OTLP, ZIPKIN), and the relatedTrace lookup per store. The cases of upstream
# trace-ref-cases.yaml are inlined: it runs check-trace-ref.sh by a path relative to the repository root,
# which here is the distro root.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl
    # The trigger below drives the SkyWalking-agent service only, so the OTLP and Zipkin providers are called here.
    - name: call the OTLP and Zipkin providers
      command: |
        for i in 1 2 3 4 5; do
          curl -s http://localhost:9093/ > /dev/null
          curl -s http://localhost:9094/ > /dev/null
          sleep 3
        done

trigger:
  action: http
  interval: 3s
  times: 5
  url: http://localhost:9260/ai/generateStream
  method: GET

verify:
  retry:
    count: 60
    interval: 3s
  cases:
    # The judge evaluated spans from all three trace stores of this one OAP.
    - query: |
        START=$(date -u -v-1H '+%Y-%m-%d %H%M' 2>/dev/null || date -u -d '1 hour ago' '+%Y-%m-%d %H%M')
        END=$(date -u '+%Y-%m-%d %H%M')
        curl -s -X POST http://${oap_host}:${oap_12800}/graphql \
          -H 'Content-Type: application/json' \
          -d '{"query":"query ($condition: GenAIEvaluationRecordQueryCondition!) { queryGenAIEvaluationRecord(condition: $condition) { genAIEvaluationRecordList { traceRef { type } } } }","variables":{"condition":{"providerId":"b3BlbmFp.0","taskName":"Faithfulness","valueType":"SCORE","queryDuration":{"start":"'"$START"'","end":"'"$END"'","step":"MINUTE"},"paging":{"pageNum":1,"pageSize":50}}}}' \
          | yq -P '[.data.queryGenAIEvaluationRecord.genAIEvaluationRecordList[].traceRef.type] | unique | sort'
      expected: ../../../../skywalking/test/e2e-v2/cases/mixed-virtual-genai/expected/trace-ref-types.yml

    # For each source, its newest record, the record its relatedTrace finds, and the stores holding its trace.
    - query: bash skywalking/test/e2e-v2/cases/mixed-virtual-genai/check-trace-ref.sh SKYWALKING_NATIVE e2e-spring-ai
      expected: ../../../../skywalking/test/e2e-v2/cases/mixed-virtual-genai/expected/trace-ref-skywalking-native.yml
    - query: bash skywalking/test/e2e-v2/cases/mixed-virtual-genai/check-trace-ref.sh OTLP e2e-openai-otlp
      expected: ../../../../skywalking/test/e2e-v2/cases/mixed-virtual-genai/expected/trace-ref-otlp.yml
    - query: bash skywalking/test/e2e-v2/cases/mixed-virtual-genai/check-trace-ref.sh ZIPKIN e2e-openai-zipkin
      expected: ../../../../skywalking/test/e2e-v2/cases/mixed-virtual-genai/expected/trace-ref-zipkin.yml
