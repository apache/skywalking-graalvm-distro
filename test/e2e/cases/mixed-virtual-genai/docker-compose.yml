# One OAP holding GenAI spans in all three trace stores: SkyWalking segments (Spring AI on the Java agent),
# native OTLP spans and Zipkin spans (an OTel-instrumented OpenAI client exporting each way).
services:
  banyandb:
    extends:
      file: ../../../../skywalking/test/e2e-v2/script/docker-compose/base-compose.yml
      service: banyandb
    ports:
      - 17912

  oap:
    image: skywalking-oap-native:latest
    expose:
      - 11800
      - 12800
      - 9411
      - 9412
      - 3200
    networks:
      - e2e
    # check-trace-ref.sh reads the trace back from GraphQL (12800), Zipkin (9412) and TraceQL /otlp (3200).
    ports:
      - 12800
      - 9412
      - 3200
    volumes:
      - ../../../../skywalking/test/e2e-v2/cases/virtual-genai/ai-evaluation.yml:/skywalking/config/ai-evaluation.yml
    environment:
      SW_HEALTH_CHECKER: default
      SW_STORAGE_BANYANDB_TARGETS: banyandb:17912
      SW_CONFIGURATION: none
      SW_OTEL_TRACE_STORAGE: otlp
      SW_RECEIVER_ZIPKIN: default
      SW_QUERY_ZIPKIN: default
      SW_TRACEQL: default
      SW_TRACEQL_ENABLE_DATASOURCE_OTLP: "true"
      SW_AI_EVALUATION: default
      SW_AI_EVALUATION_SAMPLE_RATE: 1000000
      AI_EVALUATION_ENDPOINT: http://mock-llm-server:9090/llm/evaluation/v1/chat/completions
      AI_EVALUATION_MODEL: e2e-judge
      AI_EVALUATION_API_KEY: e2e-api-key
    depends_on:
      banyandb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -nz 127.0.0.1 11800 || exit 1"]
      interval: 5s
      timeout: 60s
      retries: 120

  # Upstream bind-mounts the jar it builds; the published image carries the same jar.
  mock-llm-server:
    image: "ghcr.io/apache/skywalking/e2e-mock-llm-server:${SW_E2E_SERVICE_COMMIT}"
    networks:
      - e2e
    expose:
      - 9090
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/9090"]
      interval: 5s
      timeout: 60s
      retries: 120

  # Upstream bind-mounts the e2e-spring-ai-service jar it builds; the agent image runs the one in the
  # published image, copied out here.
  spring-ai-jar:
    image: "ghcr.io/apache/skywalking/e2e-spring-ai-service:${SW_E2E_SERVICE_COMMIT}"
    entrypoint: ["cp", "/app.jar", "/jars/spring_ai_service.jar"]
    volumes:
      - service-jars:/jars
    networks:
      - e2e

  spring-ai-service:
    image: "ghcr.io/apache/skywalking-java/skywalking-java:${SW_AGENT_JAVA_COMMIT}-java17"
    command: ["java", "-jar", "/jars/spring_ai_service.jar"]
    volumes:
      - service-jars:/jars
    ports:
      - "9260:8080"
    networks:
      - e2e
    environment:
      OPENAI_API_KEY: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      SPRING_AI_OPENAI_BASE_URL: http://mock-llm-server:9090/llm/v1
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: oap:11800
      SW_LOGGING_OUTPUT: CONSOLE
      SW_AGENT_NAME: e2e-spring-ai
      SW_AGENT_INSTANCE_NAME: spring-ai-service
      SW_PLUGIN_SPRINGAI_COLLECT_INPUT_MESSAGES: "true"
      SW_PLUGIN_SPRINGAI_COLLECT_OUTPUT_MESSAGES: "true"
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -nz 127.0.0.1 8080"]
      interval: 5s
      timeout: 60s
      retries: 120
    depends_on:
      oap:
        condition: service_healthy
      mock-llm-server:
        condition: service_healthy
      spring-ai-jar:
        condition: service_completed_successfully

  provider-otlp:
    build:
      context: ../../../../skywalking/test/e2e-v2/script/
      dockerfile: dockerfile/Dockerfile-openai.python
    networks:
      - e2e
    ports:
      - "9093:9091"
    environment:
      OPENAI_BASE_URL: http://mock-llm-server:9090/llm/otlp/v1
      OPENAI_API_KEY: xxxxxxxxxxxxxxxxxxxxxxxx
      OTEL_SERVICE_NAME: e2e-openai-otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://oap:11800
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      oap:
        condition: service_healthy
      mock-llm-server:
        condition: service_healthy
    # A GET would make an OpenAI call that the judge evaluates, so the check only connects.
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 9091), 2).close()"]
      interval: 5s
      timeout: 10s
      retries: 5
    command: ["opentelemetry-instrument", "python3", "/openai-call.py"]

  provider-zipkin:
    build:
      context: ../../../../skywalking/test/e2e-v2/script/
      dockerfile: dockerfile/Dockerfile-openai.python
    networks:
      - e2e
    ports:
      - "9094:9091"
    environment:
      OPENAI_BASE_URL: http://mock-llm-server:9090/llm/otlp/v1
      OPENAI_API_KEY: xxxxxxxxxxxxxxxxxxxxxxxx
      OTEL_SERVICE_NAME: e2e-openai-zipkin
      OTEL_TRACES_EXPORTER: zipkin_json
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: http://oap:9411/api/v2/spans
    depends_on:
      oap:
        condition: service_healthy
      mock-llm-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 9091), 2).close()"]
      interval: 5s
      timeout: 10s
      retries: 5
    command: ["opentelemetry-instrument", "python3", "/openai-call.py"]

volumes:
  service-jars:

networks:
  e2e:
