# BanyanDB credential hot-reload E2E — native OAP.
# The rotation steps are upstream's (test/e2e-v2/cases/storage/banyandb/auth-rotation/e2e.yaml):
# write the secrets file inside the OAP container and assert the reload through the OAP log, then
# run the shared storage suite against the reconnected OAP.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash skywalking/test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl

trigger:
  action: http
  interval: 5s
  times: -1
  url: http://${consumer_host}:${consumer_9092}/users
  method: POST
  body: '{"id":"123","name":"skywalking"}'
  headers:
    "Content-Type": "application/json"

verify:
  retry:
    count: 20
    interval: 10s
  cases:
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql service layer GENERAL
      expected: ../../../../skywalking/test/e2e-v2/cases/storage/expected/service.yml

    - query: |
        oap=$(docker ps -q --filter label=com.docker.compose.service=oap)
        docker exec $oap bash -c 'printf "user=test\npassword=test\n" > /tmp/bydb-secrets.properties'
        docker logs $oap 2>&1 \
          | grep -Fq "Applied the BanyanDB credentials reloaded from /tmp/bydb-secrets.properties, user=test" \
          && echo credentials-applied
      expected: ../../../../skywalking/test/e2e-v2/cases/storage/banyandb/auth-rotation/expected/credentials-applied.yml

    - query: |
        oap=$(docker ps -q --filter label=com.docker.compose.service=oap)
        docker exec $oap bash -c 'printf "user=admin\n" > /tmp/bydb-secrets.properties'
        docker logs $oap 2>&1 | grep -Fq "Applied incomplete credentials from /tmp/bydb-secrets.properties" \
          && docker logs $oap 2>&1 | grep -Fq "UNAUTHENTICATED: Invalid credentials" \
          && echo credentials-incomplete
      expected: ../../../../skywalking/test/e2e-v2/cases/storage/banyandb/auth-rotation/expected/credentials-incomplete.yml

    - query: |
        oap=$(docker ps -q --filter label=com.docker.compose.service=oap)
        docker exec $oap bash -c 'printf "user=admin\npassword=admin\n" > /tmp/bydb-secrets.properties'
        docker logs $oap 2>&1 \
          | grep -Fq "Applied the BanyanDB credentials reloaded from /tmp/bydb-secrets.properties, user=admin" \
          && echo credentials-restored
      expected: ../../../../skywalking/test/e2e-v2/cases/storage/banyandb/auth-rotation/expected/credentials-restored.yml

    - includes:
        - ../../../../skywalking/test/e2e-v2/cases/storage/storage-cases.yaml
