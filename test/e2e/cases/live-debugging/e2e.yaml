# Live Debugging E2E — native OAP with BanyanDB.
# The SWIP-13 DSL live debugger (/dsl-debugging/*) and runtime-rule hot-update (/runtime/*)
# generate fresh MAL/LAL/OAL bytecode with Javassist at runtime, which a closed-world native
# image cannot do. This distro pre-compiles all DSL at build time and serves a structured
# HTTP 501 for those admin-server endpoints. This case verifies that contract.
# Verify-only (no trigger): infra-e2e's trigger step aborts on a non-2xx response, so the
# 501 is asserted through verify cases that curl the admin-server (port 17128) directly.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH

verify:
  retry:
    count: 60
    interval: 3s
  cases:
    - includes:
        - live-debugging-cases.yaml
