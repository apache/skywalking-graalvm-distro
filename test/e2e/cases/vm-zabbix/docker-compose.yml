services:
  banyandb:
    extends:
      file: ../../../../skywalking/test/e2e-v2/script/docker-compose/base-compose.yml
      service: banyandb
    ports:
      - 17912

  oap:
    image: skywalking-oap-native:latest
    expose:
      - 11800
      - 12800
    networks:
      - e2e
    ports:
      - 12800
    environment:
      SW_HEALTH_CHECKER: default
      SW_STORAGE_BANYANDB_TARGETS: banyandb:17912
      SW_CONFIGURATION: none
      SW_RECEIVER_ZABBIX: default
    depends_on:
      banyandb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -nz 127.0.0.1 11800 || exit 1"]
      interval: 5s
      timeout: 60s
      retries: 120

  zabbix-client:
    image: zabbix/zabbix-agent:alpine-6.4.15
    networks:
      - e2e
    environment:
      ZBX_ACTIVESERVERS: oap:10051
      ZBX_HOSTNAME: vm-service
    volumes:
      - ../../../../skywalking/test/e2e-v2/cases/vm/zabbix/zabbix_agentd.conf:/etc/zabbix/zabbix_agentd.d/zabbix_agentd.conf
    depends_on:
      oap:
        condition: service_healthy

networks:
  e2e:
